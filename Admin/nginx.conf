server {
    listen 80;
    server_name localhost;

    # Set the root directory for the static files
    root /usr/share/nginx/html;
    index index.html;

    # This is the magic for SPAs:
    # Always serve index.html for any request that doesn't match a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
